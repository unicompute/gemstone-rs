name: Docs PDF

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-pdf.yml"
      - "README.md"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-pdf.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  docs-pdf:
    name: Build PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info
      - name: Install WeasyPrint
        run: python -m pip install weasyprint
      - name: Build PDFs
        run: python docs/build_pdf_docs.py
      - name: Ensure generated PDFs are current
        run: git diff --exit-code -- docs/pdf
      - uses: actions/upload-artifact@v4
        with:
          name: gemstone-rs-docs-pdf
          path: docs/pdf/*.pdf
