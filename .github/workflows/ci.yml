name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p gemstone-rs-cli -- codegen check examples/codegen/gemstone-rs.codegen
      - run: cargo run -p gemstone-rs-cli -- profile validate examples/codegen/gemstone-rs.codegen-profiles.json
      - run: cargo package -p gemstone-gci --no-verify

  vscode:
    name: VS Code Workbench
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-gemstone-rs-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run test:smoke
      - run: node ../scripts/profile_import_summary_test.js
      - run: npm run package

  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info
      - name: Install WeasyPrint
        run: python -m pip install weasyprint
      - run: npm ci
        working-directory: vscode-gemstone-rs-workbench
      - run: DRY_RUN=1 scripts/release_all.sh 0.2.0

  live:
    name: Live GemStone
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gemstone-rs live_
        env:
          GS_RUN_LIVE_RUST: "1"
          GS_LIB_PATH: ${{ secrets.GS_LIB_PATH }}
          GS_STONE: ${{ secrets.GS_STONE }}
          GS_STONE_NAME: ${{ secrets.GS_STONE_NAME }}
          GS_HOST: ${{ secrets.GS_HOST }}
          GS_NETLDI: ${{ secrets.GS_NETLDI }}
          GS_USERNAME: ${{ secrets.GS_USERNAME }}
          GS_PASSWORD: ${{ secrets.GS_PASSWORD }}
