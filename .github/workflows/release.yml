name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without leading v"
        required: true
        default: "0.2.2"
      publish-crates:
        description: "Publish crates.io packages"
        required: true
        type: boolean
        default: false
      publish-vsix:
        description: "Publish VS Code extension"
        required: true
        type: boolean
        default: false
      create-github-release:
        description: "Create GitHub release"
        required: true
        type: boolean
        default: true
      dry-run:
        description: "Run cargo publish as dry-run"
        required: true
        type: boolean
        default: true
      verify-public:
        description: "Verify crates.io, Marketplace, and GitHub release after publish"
        required: true
        type: boolean
        default: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info
      - name: Install WeasyPrint
        run: python -m pip install weasyprint
      - name: Run unified release wrapper
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
          PUBLISH_CRATES: ${{ inputs.publish-crates && '1' || '0' }}
          PUBLISH_VSIX: ${{ inputs.publish-vsix && '1' || '0' }}
          CREATE_GITHUB_RELEASE: ${{ inputs.create-github-release && '1' || '0' }}
          VERIFY_PUBLIC: ${{ inputs.verify-public && '1' || '0' }}
        run: scripts/release_all.sh "${{ inputs.version }}"
