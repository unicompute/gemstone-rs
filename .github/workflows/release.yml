name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without leading v"
        required: true
        default: "0.2.0"
      publish-crates:
        description: "Publish crates.io packages"
        required: true
        type: boolean
        default: false
      publish-vsix:
        description: "Publish VS Code extension"
        required: true
        type: boolean
        default: false
      create-github-release:
        description: "Create GitHub release"
        required: true
        type: boolean
        default: true
      dry-run:
        description: "Run cargo publish as dry-run"
        required: true
        type: boolean
        default: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info
      - name: Install WeasyPrint
        run: python -m pip install weasyprint
      - run: npm ci
        working-directory: vscode-gemstone-rs-workbench
      - run: make verify
      - name: Package VSIX
        run: make vscode-package VSIX_VERSION=${{ inputs.version }}
      - name: Build PDF docs
        run: python docs/build_pdf_docs.py
      - name: Generate release checksums
        run: |
          shasum -a 256 \
            vscode-gemstone-rs-workbench/gemstone-rs-workbench-${{ inputs.version }}.vsix \
            docs/pdf/*.pdf > SHA256SUMS
      - name: Publish crates.io
        if: ${{ inputs.publish-crates }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
        run: scripts/publish_crates.sh
      - name: Publish VS Code extension
        if: ${{ inputs.publish-vsix }}
        working-directory: vscode-gemstone-rs-workbench
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath gemstone-rs-workbench-${{ inputs.version }}.vsix --pat "$VSCE_PAT"
      - name: Build release notes
        run: |
          cat > release-notes.md <<'NOTES'
          gemstone-rs v${{ inputs.version }}

          Install CLI tools:

          ```bash
          cargo install gemstone-rs-cli
          cargo install gemstone-rs-explorer
          ```

          Use the library:

          ```bash
          cargo add gemstone-rs
          ```

          Crates.io:
          - https://crates.io/crates/gemstone-gci
          - https://crates.io/crates/gemstone-rs-macros
          - https://crates.io/crates/gemstone-rs
          - https://crates.io/crates/gemstone-rs-cli
          - https://crates.io/crates/gemstone-rs-explorer

          VS Code Marketplace:
          - https://marketplace.visualstudio.com/items?itemName=unicompute.gemstone-rs-workbench

          Release assets:
          - VSIX package
          - PDF documentation
          - SHA256SUMS
          NOTES
      - name: Create GitHub release
        if: ${{ inputs.create-github-release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ inputs.version }}" || true
          git push origin "v${{ inputs.version }}" || true
          gh release create "v${{ inputs.version }}" \
            "vscode-gemstone-rs-workbench/gemstone-rs-workbench-${{ inputs.version }}.vsix" \
            "SHA256SUMS" \
            docs/pdf/*.pdf \
            --title "gemstone-rs v${{ inputs.version }}" \
            --notes-file release-notes.md
